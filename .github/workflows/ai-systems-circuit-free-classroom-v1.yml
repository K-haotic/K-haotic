name: AI Systems Circuit free classroom source QA

on:
  pull_request:
    paths:
      - "docs/ai-systems-circuit/**"
      - "docs/experience/**"
      - "docs/organization/**"
      - "docs/index.html"
      - "tests/ci/test_ai_learning_free_exercises_v1.cjs"
      - "tests/ci/test_ai_learning_passport_v1.cjs"
      - "tests/ci/test_public_portal_design_v2.cjs"
      - ".github/workflows/ai-systems-circuit-free-classroom-v1.yml"
  push:
    branches: [main]
    paths:
      - "docs/ai-systems-circuit/**"
      - "docs/experience/**"
      - "docs/organization/**"
      - "docs/index.html"
      - "tests/ci/test_ai_learning_free_exercises_v1.cjs"
      - "tests/ci/test_ai_learning_passport_v1.cjs"
      - "tests/ci/test_public_portal_design_v2.cjs"
      - ".github/workflows/ai-systems-circuit-free-classroom-v1.yml"

permissions:
  contents: read

jobs:
  local-only-educational-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out public education source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify local-only JavaScript and educational interactions
        run: |
          set -euo pipefail
          node --check docs/experience/portal.js
          node --check docs/ai-systems-circuit/learn/lesson.js
          node --check docs/ai-systems-circuit/learn/passport.js
          node --check tests/ci/test_ai_learning_free_exercises_v1.cjs
          node --check tests/ci/test_ai_learning_passport_v1.cjs
          node tests/ci/test_ai_learning_free_exercises_v1.cjs
          node tests/ci/test_ai_learning_passport_v1.cjs
          node --check tests/ci/test_public_portal_design_v2.cjs
          node tests/ci/test_public_portal_design_v2.cjs
