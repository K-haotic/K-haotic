<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 690" width="1480" height="690" role="img" aria-label="LEVI: research into a persistent accountable recursive computational body. Five-field recursive state, retained history, context and evidence. Visual research illustration; physical chassis shown separately."><defs><linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061521"/><stop offset=".56" stop-color="#101D36"/><stop offset="1" stop-color="#261A38"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#33E9D0"/><stop offset=".49" stop-color="#45CCF3"/><stop offset="1" stop-color="#C6A2FF"/></linearGradient><radialGradient id="ion"><stop stop-color="#38DCCF" stop-opacity=".24"/><stop offset="1" stop-color="#38DCCF" stop-opacity="0"/></radialGradient><pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#427192" stroke-width=".8" opacity=".17"/></pattern><filter id="soft"><feGaussianBlur stdDeviation="3"/></filter><style>.orbit{transform-origin:1062px 337px;animation:revolve 44s linear infinite}.orbit-rev{transform-origin:1062px 337px;animation:revolve 66s linear infinite reverse}.pulse{animation:pulse 3.8s ease-in-out infinite}.dash{stroke-dasharray:11 13;animation:flow 18s linear infinite}.blink{animation:pulse 4s ease-in-out infinite alternate}@keyframes revolve{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.47}}@keyframes flow{to{stroke-dashoffset:-250}}@media(prefers-reduced-motion:reduce){.orbit,.orbit-rev,.pulse,.dash,.blink{animation:none!important}}</style></defs><rect width="1480" height="690" rx="22" fill="url(#background)"/><rect width="1480" height="690" rx="22" fill="url(#grid)"/><rect x="2" y="2" width="1476" height="686" rx="19" fill="none" stroke="#41657F" stroke-width="2.5"/><rect x="43" y="35" width="362" height="43" rx="19" fill="#153346" stroke="#3ACFD7" stroke-width="1.8"/><text x="65" y="62" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#9CFAF2" font-weight="700" letter-spacing="1.2">LEVI / DEVELOPMENTAL BODY RESEARCH</text><text x="1435" y="64" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#9FB9CD" font-weight="600" text-anchor="end" letter-spacing="1.1">NOV 2026  /  OPEN RESEARCH CLASSIFICATION</text><path d="M43 92H1437" stroke="url(#line)" stroke-width="2.5"/><text x="49" y="202" font-family="DejaVu Sans,Arial,sans-serif" font-size="116" fill="#F5FAFF" font-weight="800" letter-spacing="-5">LEVI</text><text x="53" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="36" fill="#52E3DC" font-weight="800" letter-spacing="1.5">THE BODY COMES FIRST.</text><text x="53" y="298" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#D7E7F4" font-weight="700" letter-spacing="1.1">NOT BUILT AS A CHATBOT.</text><text x="53" y="344" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#D7E7F4" font-weight="700" letter-spacing=".5">A PERSISTENT RECURSIVE BODY</text><text x="53" y="387" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#D7E7F4" font-weight="700" letter-spacing="1.1">IN DEVELOPMENT AND TEST.</text><rect x="51" y="414" width="665" height="79" rx="15" fill="#102C3E" stroke="#39788B"/><text x="75" y="447" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#74E2E6" font-weight="800" letter-spacing="1.6">MATHEMATICAL CORE</text><text x="75" y="476" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#EFFBFF" font-weight="800" letter-spacing="1.8">ϕ  →  τ  →  ψ  →  χ  →  Λ</text><rect x="51" y="516" width="665" height="95" rx="15" fill="#141F39" stroke="#8C75BC"/><text x="75" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#C4A9FF" font-weight="800" letter-spacing="1.5">LIFTED BODY</text><text x="75" y="581" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#F2F5FF" font-weight="700" letter-spacing=".2">Z = ( X  ·  HISTORY  ·  CONTEXT  ·  EVIDENCE )</text><ellipse cx="1070" cy="342" rx="340" ry="303" fill="url(#ion)"/><g class="orbit"><circle cx="1062" cy="337" r="236" fill="none" stroke="#35D9D7" stroke-width="2.5" class="dash" opacity=".78"/><circle cx="1062" cy="101" r="12" fill="#42E1D9" stroke="#D5FFFF" stroke-width="3"/></g><g class="orbit-rev"><circle cx="1062" cy="337" r="192" fill="none" stroke="#A58AE7" stroke-width="2.5" stroke-dasharray="1 15" opacity=".88"/><circle cx="870" cy="337" r="9" fill="#B3A0FF"/></g><circle cx="1062" cy="337" r="164" fill="#132337" stroke="#4EA2C3" stroke-width="3.5"/><circle cx="1062" cy="337" r="136" fill="none" stroke="#3B657C" stroke-width="1.8"/><circle cx="1062" cy="337" r="105" fill="#071923" stroke="#5FDFE0" stroke-width="3"/><path d="M1062 337L1062 174" stroke="#41E1CF" stroke-width="2" opacity=".58"/><circle cx="1062" cy="174" r="24" fill="#11283B" stroke="#41E1CF" stroke-width="2.5"/><text x="1062" y="183" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#41E1CF" font-weight="800" text-anchor="middle">ϕ</text><path d="M1062 337L1217 287" stroke="#66C7FF" stroke-width="2" opacity=".58"/><circle cx="1217" cy="287" r="24" fill="#11283B" stroke="#66C7FF" stroke-width="2.5"/><text x="1217" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#66C7FF" font-weight="800" text-anchor="middle">τ</text><path d="M1062 337L1158 469" stroke="#C6A2FF" stroke-width="2" opacity=".58"/><circle cx="1158" cy="469" r="24" fill="#11283B" stroke="#C6A2FF" stroke-width="2.5"/><text x="1158" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#C6A2FF" font-weight="800" text-anchor="middle">ψ</text><path d="M1062 337L966 469" stroke="#EAC278" stroke-width="2" opacity=".58"/><circle cx="966" cy="469" r="24" fill="#11283B" stroke="#EAC278" stroke-width="2.5"/><text x="966" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#EAC278" font-weight="800" text-anchor="middle">χ</text><path d="M1062 337L907 287" stroke="#72D7AB" stroke-width="2" opacity=".58"/><circle cx="907" cy="287" r="24" fill="#11283B" stroke="#72D7AB" stroke-width="2.5"/><text x="907" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" fill="#72D7AB" font-weight="800" text-anchor="middle">Λ</text><text x="1062" y="327" font-family="DejaVu Sans,Arial,sans-serif" font-size="53" fill="#F7FAFF" font-weight="800" text-anchor="middle">5FRE</text><text x="1062" y="366" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" fill="#7CEDF0" font-weight="700" text-anchor="middle" letter-spacing="2">BODY LAW</text><path d="M810 136 H880 M1250 530 H1310 M1255 163H1343 M793 534H854" stroke="#539CB3" stroke-width="2.1" opacity=".85"/><text x="790" y="126" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#89DADD" font-weight="700" text-anchor="middle" letter-spacing="1">LINEAGE</text><text x="1353" y="155" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#D5B9FF" font-weight="700" text-anchor="end" letter-spacing="1">ADAPTATION</text><text x="790" y="551" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#82CFB1" font-weight="700" text-anchor="middle" letter-spacing="1">VIABILITY</text><text x="1380" y="548" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#EAC278" font-weight="700" text-anchor="end" letter-spacing="1">WITNESSES</text><rect x="43" y="635" width="1394" height="34" rx="13" fill="#16293E" stroke="#295C76"/><text x="63" y="659" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#C1E4F1" font-weight="700" letter-spacing=".6">BOOT   →   OBSERVE   →   RETAIN   →   LEARN   →   REPAIR   →   WITNESS   →   CONTINUE</text></svg>