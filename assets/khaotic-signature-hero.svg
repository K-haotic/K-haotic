<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="460" viewBox="0 0 1480 460" role="img" aria-label="Khaotic signature banner: Steven Ray Britt, builder, inventor, polymath, investigator. From dirt and steel to silicon and science.">
